<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile viewport QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: start center;
      padding: 18px;
      overflow: hidden;
      background: #dbe6f5;
    }
    .device {
      width: 314px;
      height: 680px;
    }
    iframe {
      width: 390px;
      height: 844px;
      border: 1px solid rgba(15, 23, 42, 0.18);
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.2);
      transform: scale(0.8);
      transform-origin: top left;
    }
  </style>
  <script>localStorage.setItem('lang', 'en');</script>
</head>
<body>
  <main class="device">
    <iframe id="mobile-qa-frame" src="./?qa=mobile" title="390 by 844 mobile preview"></iframe>
  </main>
</body>
</html>
