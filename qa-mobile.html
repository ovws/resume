<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mobile viewport QA</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: start center;
      padding: 18px;
      overflow: hidden;
      background: #dbe6f5;
    }
    .device {
      width: 314px;
      height: 680px;
    }
    iframe {
      width: 390px;
      height: 844px;
      border: 1px solid rgba(15, 23, 42, 0.18);
      border-radius: 28px;
      background: #ffffff;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.2);
      transform: scale(0.8);
      transform-origin: top left;
    }
    #qa-results {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 360px;
      margin: 0;
      padding: 14px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.92);
      color: #dbeafe;
      font: 12px/1.5 monospace;
      white-space: pre-wrap;
    }
  </style>
  <script>localStorage.setItem('lang', 'en');</script>
</head>
<body>
  <main class="device">
    <iframe id="mobile-qa-frame" data-src="./?qa=mobile" title="390 by 844 mobile preview"></iframe>
  </main>
  <pre id="qa-results">waiting</pre>
  <script>
    const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
    const frame = document.getElementById('mobile-qa-frame');
    const output = document.getElementById('qa-results');
    let hasRun = false;

    async function runChecks() {
      if (hasRun) return;
      let frameDocument;
      for (let attempt = 0; attempt < 40; attempt += 1) {
        frameDocument = frame.contentDocument;
        if (frameDocument?.querySelector('.app-viewport')) break;
        await wait(100);
      }

      if (!frameDocument?.querySelector('.app-viewport')) {
        output.textContent = 'mobile app did not load';
        return;
      }

      hasRun = true;
      await wait(500);
      const frameWindow = frame.contentWindow;
      const tencentButton = frameDocument.querySelector('.nav-node-btn[data-target="3"]');
      const languageButton = frameDocument.getElementById('btn-lang');

      tencentButton.click();
      await wait(1300);

      const targetRect = frameDocument.getElementById('node-3').getBoundingClientRect();
      const navigation = {
        scrollY: Math.round(frameWindow.scrollY),
        targetTop: Math.round(targetRect.top),
        active: frameDocument.querySelector('.nav-node-btn.active')?.innerText.trim()
      };

      languageButton.click();
      await wait(150);

      output.textContent = JSON.stringify({
        navigation,
        language: {
          name: frameDocument.getElementById('hero-name')?.textContent,
          button: languageButton.innerText.trim()
        }
      }, null, 2);
    }

    frame.src = frame.dataset.src;
    runChecks();
  </script>
</body>
</html>
